<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090b12">
<title>Membuka halaman DISTENDANG...</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090b12;color:#f5f7ff;font-family:system-ui,sans-serif}.loading{padding:24px;text-align:center;color:#aeb6c9}</style>
</head>
<body>
<div class="loading">Memeriksa halaman DISTENDANG...</div>
<script>
(function(){
  var base="/distendang/";
  var path;
  try{path=decodeURIComponent(location.pathname)}catch(e){path=location.pathname}
  if(path===base || path===base.slice(0,-1)){
    location.replace(base);
    return;
  }
  var slug=path.startsWith(base)?path.slice(base.length).split("/").filter(Boolean)[0]:"";
  if(slug){
    location.replace(base+"?page="+encodeURIComponent(slug));
  }else{
    location.replace(base+"?page=halaman-tidak-ditemukan");
  }
})();
</script>
</body>
</html>
