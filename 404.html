<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Membuka halaman DISTENDANG...</title>
</head>
<body>
<p>Membuka halaman...</p>
<script>
(function(){
  var base="/distendang/";
  var path=decodeURIComponent(location.pathname);
  var slug=path.startsWith(base) ? path.slice(base.length).split("/").filter(Boolean)[0] : "";
  if(slug){
    location.replace(base+"?page="+encodeURIComponent(slug));
  }else{
    location.replace(base);
  }
})();
</script>
</body>
</html>
